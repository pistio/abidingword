# Publishes a SIGNED Windows Development/Test update that installed test builds
# of Abiding Word offer to their users (docs/updates.md). Ordinary installers
# are still made by native-builds.yml. This is never a stable release.
#
# Started in exactly two ways:
#   1. AUTOMATICALLY, when the normal "CI" workflow has completed
#      SUCCESSFULLY for a push to `main`. The commit published is the exact
#      commit CI passed on (github.event.workflow_run.head_sha), and only
#      while it is still the newest commit on `main`.
#   2. BY HAND (Actions → Publish Windows test update → Run workflow), for
#      recovery or a retry. Unchanged.
# Never by a pull request, a feature branch, or a failed/cancelled CI run.
#
# Why `workflow_run` is safe here: GitHub runs a workflow_run workflow from
# the DEFAULT branch's copy of this file, with the default branch's secrets
# access, and the triggering CI run's data is only ever read as plain text.
# Pull-request code is never checked out by this workflow: the guards below
# accept only a push-event CI run on `main` of this repository (a fork's pull
# request, even from a branch named "main", is event=pull_request), and the
# checkout is pinned to that commit's SHA.
#
# Three jobs, so that signing secrets never reach the job that compiles this
# repository's code:
#   gate     – no secrets. Decides what (if anything) to publish.
#   build    – no secrets. Builds the NSIS installer with the updater section
#              added by scripts/updater.mjs.
#   publish  – signs the finished installer with `tauri signer sign` (the
#              only step that sees the signing key), writes latest.json and
#              publishes both to the updates repository named in
#              src-tauri/updater/test-channel.json (the only step that sees
#              the updates token).
# The `publish` job runs in the GitHub Environment "windows-test-updates",
# which holds the secrets and must allow the `main` branch (Settings →
# Environments). A failure here never affects CI or the code on `main`.
name: Publish Windows test update

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Base version X.Y.Z. The build is X.Y.Z-dev.<run number>, which is always newer than the previous test build."
        required: true
        default: "0.5.0"
      notes:
        description: "Short release notes shown with the update (optional)"
        required: false
        default: ""
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  # The base of automatic builds (X.Y.Z-dev.N). It is raised automatically to
  # the base of the already published test build when that is newer.
  DEFAULT_BASE_VERSION: "0.5.0"

# One publish at a time, so latest.json can never go backwards.
concurrency:
  group: windows-test-update
  cancel-in-progress: false

jobs:
  gate:
    name: Decide what to publish (no secrets)
    runs-on: ubuntu-latest
    # Defence in depth: the trigger already filters to `main`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Choose the commit
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: publishing $DISPATCH_SHA"
            exit 0
          fi
          if ! [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CI reported a malformed commit id." >&2
            exit 1
          fi
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "sha=$CI_SHA" >> "$GITHUB_OUTPUT"
          if [ "$tip" = "$CI_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "CI passed on $CI_SHA, which is the newest commit on main: publishing it."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI passed on $CI_SHA but main has moved on to $tip; the newer commit's own CI run publishes instead."
          fi

  build:
    name: Build signed-update installer (no secrets)
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify Windows source and migration catalogue
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: node scripts/build-provenance.mjs --expected-sha "$env:EXPECTED_SOURCE_SHA" --require-clean --out "$env:RUNNER_TEMP/build-provenance.json"
      - name: Retain Windows source evidence
        uses: actions/upload-artifact@v4
        with:
          name: Windows-source-provenance
          path: ${{ runner.temp }}/build-provenance.json
          retention-days: 14
      - name: Choose the version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE: ${{ inputs.base_version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # The version is X.Y.Z-dev.<run number of this workflow>. Run numbers
          # only ever increase (across manual and automatic runs alike), so the
          # result is always newer than the previous test build of the same base.
          endpoint=$(node -e "import('./scripts/updater.mjs').then(m=>console.log(m.endpointFor(m.readChannel())))")
          curl -fsSL "$endpoint" -o current.json || rm -f current.json
          args=(--run "$RUN_NUMBER" --default "$DEFAULT_BASE_VERSION")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then args+=(--base "$INPUT_BASE"); fi
          if [ -f current.json ]; then args+=(--current current.json); fi
          version=$(node scripts/updater.mjs choose-version "${args[@]}")
          echo "Test build version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Updater configuration (fails until the public key and repository are set)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/updater.mjs overlay --version "$VERSION" --out "$RUNNER_TEMP/updater.conf.json"
      - name: Build the NSIS installer
        shell: bash
        run: npx tauri build --bundles nsis --config "$RUNNER_TEMP/updater.conf.json"
      - name: Name the installer
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir staged
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          cp "$installer" "staged/Abiding-Word_${VERSION}_x64-setup.exe"
          ls -l staged
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-installer
          path: staged/*.exe
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Sign and publish
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment: windows-test-updates
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # No install scripts: the signing step runs only the prebuilt Tauri CLI.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: windows-test-installer
          path: staged
      - name: Sign the installer (the only step that sees the signing key)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "The TAURI_SIGNING_PRIVATE_KEY secret is not set in the windows-test-updates environment." >&2
            exit 1
          fi
          # Binds the signature to this exact version (the app requires it).
          npx tauri signer sign --app-version "$VERSION" "staged/Abiding-Word_${VERSION}_x64-setup.exe"
          test -s "staged/Abiding-Word_${VERSION}_x64-setup.exe.sig"
      - name: Write latest.json
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          notes="$INPUT_NOTES"
          if [ -z "$notes" ] && [ "$EVENT_NAME" = "workflow_run" ]; then
            notes="Automatic test build of main (${SHA:0:7})."
          fi
          node scripts/updater.mjs manifest --version "$VERSION" \
            --installer "staged/Abiding-Word_${VERSION}_x64-setup.exe" \
            --sig "staged/Abiding-Word_${VERSION}_x64-setup.exe.sig" \
            --notes "$notes" --out latest.json
          cat latest.json
      - name: Check the version is newer than the published one
        run: |
          endpoint=$(node -e "import('./scripts/updater.mjs').then(m=>console.log(m.endpointFor(m.readChannel())))")
          curl -fsSL "$endpoint" -o current.json || rm -f current.json
          node scripts/updater.mjs check-newer --version "$VERSION" --current current.json
      - name: Confirm this is still the newest commit on main (automatic runs)
        id: fresh
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved on to $tip while $SHA was building; nothing is published for $SHA (the newer commit's own CI run publishes instead)."
          fi
      - name: Publish (installer first, then the channel pointer)
        if: steps.fresh.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
        run: |
          repo=$(node -e "import('./scripts/updater.mjs').then(m=>console.log(m.readChannel().updatesRepository))")
          pointer=$(node -e "import('./scripts/updater.mjs').then(m=>console.log(m.POINTER_TAG))")
          if [ -z "$GH_TOKEN" ]; then
            echo "The UPDATES_REPO_TOKEN secret is not set in the windows-test-updates environment." >&2
            exit 1
          fi
          files=("staged/Abiding-Word_${VERSION}_x64-setup.exe" "staged/Abiding-Word_${VERSION}_x64-setup.exe.sig")
          # The versioned release may exist from an earlier attempt of this same
          # run that stopped before the pointer moved; the check above has
          # already shown that the pointer is not at this version.
          if gh release view "test-v${VERSION}" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "test-v${VERSION}" "${files[@]}" --repo "$repo" --clobber
          else
            gh release create "test-v${VERSION}" --repo "$repo" --prerelease \
              --title "Abiding Word ${VERSION} (test build)" \
              --notes "Development/test build ${VERSION} of source commit ${SHA}. Not a stable release." \
              "${files[@]}"
          fi
          if gh release view "$pointer" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$pointer" latest.json --repo "$repo" --clobber
          else
            gh release create "$pointer" --repo "$repo" --prerelease \
              --title "Test channel pointer" \
              --notes "Holds only latest.json, which installed test builds read. Replaced on every test update." \
              latest.json
          fi
      # GitHub's download CDN can keep serving the previous latest.json for
      # minutes after the asset was replaced, so the upload is confirmed through
      # the API, which is current. The job token only READS the public updates
      # repository; it is not a secret and cannot write there.
      - name: Confirm the upload through GitHub's API
        if: steps.fresh.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=$(node -e "import('./scripts/updater.mjs').then(m=>console.log(m.readChannel().updatesRepository))")
          pointer=$(node -e "import('./scripts/updater.mjs').then(m=>console.log(m.POINTER_TAG))")
          installer="staged/Abiding-Word_${VERSION}_x64-setup.exe"
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$repo/releases/tags/$pointer" > pointer-release.json &&
              id=$(node -p "(JSON.parse(require('fs').readFileSync('pointer-release.json','utf8')).assets.find(a => a.name === 'latest.json') ?? {}).id ?? ''") &&
              [ -n "$id" ] &&
              gh api -H "Accept: application/octet-stream" "repos/$repo/releases/assets/$id" > published.json &&
              gh api "repos/$repo/releases/tags/test-v${VERSION}" > version-release.json &&
              node scripts/updater.mjs verify-release --version "$VERSION" --expected latest.json \
                --published published.json --assets version-release.json --installer "$installer"; then
              echo "GitHub confirms: test-channel/latest.json offers $VERSION and test-v$VERSION holds the installer and signature."
              exit 0
            fi
            echo "Attempt $attempt: GitHub's API does not show the finished upload yet."
            sleep 5
          done
          echo "The upload of $VERSION is not confirmed by GitHub's API." >&2
          exit 1
      # The public download URL is what installed apps read. It is only checked
      # for the record: a cache that has not refreshed yet must not fail a
      # publish that GitHub's API has confirmed.
      - name: Check the public download URL (informational)
        id: public
        if: steps.fresh.outputs.current == 'true'
        continue-on-error: true
        run: |
          endpoint=$(node -e "import('./scripts/updater.mjs').then(m=>console.log(m.endpointFor(m.readChannel())))")
          seen=no
          for attempt in 1 2 3; do
            if curl -fsSL -H 'Cache-Control: no-cache' "$endpoint" -o public.json &&
              [ "$(node -p "JSON.parse(require('fs').readFileSync('public.json','utf8')).version")" = "$VERSION" ]; then
              seen=yes
              break
            fi
            sleep 10
          done
          echo "propagated=$seen" >> "$GITHUB_OUTPUT"
          if [ "$seen" = no ]; then
            echo "::notice::The public download URL still serves the previous latest.json (CDN cache). The upload is confirmed through GitHub's API; installed apps see $VERSION once the cache refreshes."
          fi
      - name: Summary
        if: steps.fresh.outputs.current == 'true'
        env:
          PROPAGATED: ${{ steps.public.outputs.propagated }}
        run: |
          api_version=$(node -p "JSON.parse(require('fs').readFileSync('published.json','utf8')).version")
          if [ "$PROPAGATED" = yes ]; then cdn="serves it"; else cdn="not refreshed yet (CDN cache); the upload is confirmed through GitHub's API"; fi
          {
            echo "### Windows test update published"
            echo "- Source commit: \`$SHA\`"
            echo "- Version: \`$VERSION\`"
            echo "- Release tag: \`test-v$VERSION\`"
            echo "- \`test-channel/latest.json\` version (GitHub API): \`$api_version\`"
            echo "- Public download URL: $cdn"
          } >> "$GITHUB_STEP_SUMMARY"
