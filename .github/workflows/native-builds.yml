# Unsigned Windows and Linux test installers, uploaded as workflow
# artifacts (not GitHub Releases). Runs when started by hand (Actions →
# Native builds → Run workflow), on pushes to main and on tags, and on a
# feature/fix/chore branch push whose commit message contains
# "[native-build]".
name: Native builds

on:
  workflow_dispatch:
    inputs:
      selection_spike:
        description: Include the v0.5 selection-check panel (VITE_SELECTION_SPIKE=1)
        type: boolean
        default: false
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
    tags: ["*"]

permissions:
  contents: read

env:
  # Off unless asked for by hand; the app checks for exactly "1".
  VITE_SELECTION_SPIKE: ${{ inputs.selection_spike && '1' || '' }}

jobs:
  windows:
    name: Windows package
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[native-build]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify Windows source and migration catalogue
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/build-provenance.mjs --expected-sha "$env:EXPECTED_SOURCE_SHA" --require-clean --out "$env:RUNNER_TEMP/build-provenance.json"
      - name: Retain Windows source evidence
        uses: actions/upload-artifact@v4
        with:
          name: Windows-native-source-provenance
          path: ${{ runner.temp }}/build-provenance.json
          retention-days: 14
      - name: Tool versions
        run: node --version; npm --version; rustc --version; cargo --version
      - run: npm ci
      - name: Build installers
        run: npm run tauri build
      # Only the installers: nothing else from the runner leaves it.
      - uses: actions/upload-artifact@v4
        with:
          name: Abiding-Word-Windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux package
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[native-build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tool versions
        run: node --version && npm --version && rustc --version && cargo --version
      - run: npm ci
      - name: Build packages
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Abiding-Word-Linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
