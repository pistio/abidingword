[package]
name = "e3-review-probe"
version = "0.1.0"
edition = "2021"
publish = false

# The reviewer's probe: includes the E3 harness's USFM text reader READ-ONLY
# (src-tauri/tests/eval_support/usfm_text.rs, by path) and prints what it
# reads, so that it can be compared with the Python reader and the reviewer's
# own extractor. Nothing of the probe is linked into the harness.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[workspace]
