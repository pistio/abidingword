[package]
name = "e2-review-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
abiding-word = { path = "/home/user/abidingword/src-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 0
