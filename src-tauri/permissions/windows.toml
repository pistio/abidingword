# Which of the app's own commands each window may call (v0.18.3).
#
# Every command registered in src/lib.rs is declared to Tauri by build.rs,
# so a command no set grants is refused to every window. The capabilities in
# capabilities/ attach one set to each window. tests/capabilities.rs keeps
# this file, the registered commands and the interface's calls in step:
# a new command must be added here deliberately, to the window that uses it.
#
# docs/correctness-hardening-v0.18.3.md lists the inventory and the reasons.

[[set]]
identifier = "audience-window"
description = "The audience screen of a presentation: its audience-only document, where the presenter is, the presentation's slide images and template pages, and handing a clicker key to the Presenter View. Nothing else: no dialogs, files, exports, library, Bibles, settings, assistant, updates or links."
permissions = [
  "allow-presentation-audience",
  "allow-presentation-audience-state",
  "allow-presentation-audience-key",
  "allow-presentation-layout",
  "allow-presentation-image",
]

